<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Games i think</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background"></div>


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        GAME<span>PLAY</span>
    </div>


    <button class="sideButton" onclick="showCategory('All')">
        🎮 All Games
    </button>


    <button class="sideButton" onclick="showCategory('Action')">
        ⚔️ Action
    </button>


    <button class="sideButton" onclick="showCategory('Arcade')">
        🕹️ Arcade
    </button>


    <button class="sideButton" onclick="showCategory('Vehical')">
        Vehical
    </button>


    <button class="sideButton" onclick="showFavorites()">
        ⭐ Favorites
    </button>


</aside>




<!-- MAIN -->

<main>


<header>


<h1>
The Games
</h1>


<div class="searchBox">

<input 
id="search"
placeholder="Search games..."
>


</div>


</header>





<!-- PLAYER -->


<section class="player">


<div class="playerTop">

<h2 id="playing">
Select a game
</h2>


<button onclick="fullscreenGame()">
⛶ Fullscreen
</button>


</div>



<iframe 
id="gameFrame"
src="">
</iframe>



</section>






<!-- GAMES -->


<section>


<h2 class="sectionTitle">
Games
</h2>


<div id="games">

</div>


</section>




</main>



<script src="games.js"></script>

<script src="script.js"></script>


</body>

</html>
